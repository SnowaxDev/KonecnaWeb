name: Keep backend awake

# Render's free tier spins the backend down after ~15 min of inactivity, which
# causes a ~50s cold start on the next visit. This pings the health endpoint
# every 10 minutes so the instance stays warm and pages load fast.
#
# Note: GitHub only runs scheduled workflows on the default branch, and may
# delay them under load. For rock-solid uptime use an external monitor
# (UptimeRobot / cron-job.org) on the same URL as well.

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health
        run: |
          URL="https://konecnaweb.onrender.com/api/health"
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 90 "$URL" || echo "000")
            echo "Attempt $i → HTTP $code"
            if [ "$code" = "200" ]; then
              echo "Backend is awake."
              exit 0
            fi
            sleep 25
          done
          echo "Backend did not respond healthy (still waking up or down)."
          # Exit 0 so a transient miss doesn't spam failure notifications.
          exit 0
